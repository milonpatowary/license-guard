name: Release

# Publishes to npm. Two ways in:
#
#   1. Push a tag:
#        npm version patch        # bumps package.json, commits, creates the tag
#        git push --follow-tags
#
#   2. Actions -> Release -> Run workflow, and type the version. The workflow
#      creates the tag itself. This exists because pushing a tag is not always
#      possible — some networks and proxies permit writes to refs/heads/* and
#      refuse refs/tags/*, which shows up as a bare 403 with no explanation.
#
# Two ways to authenticate to npm:
#
#   token   an NPM_TOKEN repository secret.
#   OIDC    set the repository variable NPM_TRUSTED_PUBLISHING=true, configure
#           this package's Trusted Publisher on npmjs.com (this repository,
#           workflow filename release.yml, and at least one allowed action),
#           and delete the secret. No long-lived credential exists at all.
#
# Publishing from CI rather than a laptop buys three things: the tests that gate
# the release are the same ones CI runs, --provenance produces a real attestation
# (it only does so from a trusted CI environment — the same flag run locally is
# accepted and attests nothing), and no long-lived npm token has to live on
# anyone's machine.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (must match package.json)'
        required: true
        type: string

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # mint the OIDC token for provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Required for npm to authenticate at publish time, whether that is via
          # OIDC or a token.
          registry-url: 'https://registry.npmjs.org'

      # Node 22 bundles npm 10.9.x, and trusted publishing needs 11.5.1 or
      # later. An old npm does not error on an OIDC-only setup — it simply
      # never attempts the token exchange, falls back to token auth, finds no
      # token, and dies as ENEEDAUTH. That is indistinguishable from a missing
      # secret and sends you looking in entirely the wrong place.
      - name: npm new enough to speak OIDC
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: npm install -g npm@latest

      - run: npm install

      # A version that disagrees with package.json publishes the wrong version
      # under the right name, and npm versions are immutable — so this is
      # settled before anything else runs, whichever way the run was started.
      - name: Resolve and check the version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "requested=$VERSION  package.json=$PKG"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Requested v$VERSION does not match package.json version $PKG."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Whichever way this run authenticates, the failure is expensive to find
      # at the last step, after the suite has already run. Both modes are
      # checked here, in about a second.
      - name: Check how this run will authenticate to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED" = "true" ]; then
            # Proof the job can actually mint an OIDC token. Without
            # "permissions: id-token: write" this variable is simply absent and
            # npm silently falls back to token auth.
            if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
              echo "::error::This job cannot mint an OIDC token, so trusted publishing cannot work. Check that the workflow grants permissions: id-token: write."
              exit 1
            fi
            NPM_VERSION=$(npm --version)
            if [ "$(printf '11.5.1\n%s\n' "$NPM_VERSION" | sort -V | head -1)" != "11.5.1" ]; then
              echo "::error::npm $NPM_VERSION is too old for trusted publishing, which needs 11.5.1 or later. An older npm ignores OIDC rather than failing on it, so the run dies later as ENEEDAUTH instead."
              exit 1
            fi
            echo "Mode: trusted publishing. npm $NPM_VERSION, OIDC token endpoint present, no token in use."
            exit 0
          fi

          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is not set on this repository. Secrets are per-repository — setting one on a sibling repo does nothing here. Add it under Settings > Secrets and variables > Actions, or set the repository variable NPM_TRUSTED_PUBLISHING=true if you have configured npm Trusted Publishing instead."
            exit 1
          fi
          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::npm did not accept the NPM_TOKEN secret: $WHO"
            exit 1
          fi
          echo "Mode: token. Authenticated to npm as $WHO."

      # npm would reject a duplicate anyway, but it does so after running
      # everything below. Failing here says why in one line.
      - name: Version must not already exist on npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published. npm versions are immutable — bump instead."
            exit 1
          fi
          echo "$NAME@$VERSION is unpublished; continuing."

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: The demo still runs
        run: npm run demo

      - name: The worker still builds for Cloudflare
        run: >-
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/worker-build
          --config server/wrangler.toml

      # Last look at the tarball in the log, so a release always records what
      # actually shipped — and so a stray plaintext file is visible before it
      # reaches the registry rather than after.
      - name: Show what will publish
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Deliberately empty under trusted publishing. npm detects the OIDC
          # environment and exchanges a short-lived, workflow-scoped token
          # itself; leaving a stale secret in the environment only gives it
          # something wrong to try first. (--provenance is redundant there too,
          # since trusted publishing attests by default, but it is harmless and
          # keeps one publish command for both modes.)
          NODE_AUTH_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' && '' || secrets.NPM_TOKEN }}

      # Release notes are built into a file rather than passed inline. A
      # multi-line --notes argument must stay indented inside the block scalar;
      # a line starting at column 0 ends the block and makes the whole workflow
      # unparseable, which GitHub reports as a zero-second failure named after
      # the file path, with no error message anywhere in the UI.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"
          {
            echo "Published to npm as \`${NAME}@${VERSION}\`."
            echo
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          } > /tmp/release-notes.md
          # --target is what lets a dispatched run create the tag; on a tag
          # push the tag already exists and gh reuses it.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md

      # E403 from the registry after a successful login is the confusing one:
      # the token is valid, it is simply not permitted to publish this package.
      # For a name that does not exist yet, that almost always means a granular
      # access token scoped to selected packages, which cannot create new ones.
      - name: Explain a publish rejection
        if: failure()
        run: |
          cat <<'NOTE'
          If the Publish step failed with:

            npm error 403 Forbidden - PUT https://registry.npmjs.org/<name>
            You may not perform that action with these credentials.

          then the token authenticated and the registry refused the write. The
          usual causes, in order of likelihood:

            1. A granular access token whose "Packages and scopes" is set to
               "Only select packages". Such a token cannot create a package
               that does not exist yet. Set it to "All packages" with read and
               write, or publish the first version by hand and then narrow the
               token to that package.
            2. The name is taken by someone else. `npm view <name>` will say so.
            3. The account has publishing disabled, or the package is owned by
               an org this account is not a member of.

          A missing or expired token fails earlier, at the credentials check.
          NOTE
