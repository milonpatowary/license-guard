name: Release

# Publishes to npm. Two ways in:
#
#   1. Push a tag:
#        npm version patch        # bumps package.json, commits, creates the tag
#        git push --follow-tags
#
#   2. Actions -> Release -> Run workflow, and type the version. The workflow
#      creates the tag itself. This exists because pushing a tag is not always
#      possible — some networks and proxies permit writes to refs/heads/* and
#      refuse refs/tags/*, which shows up as a bare 403 with no explanation.
#
# Publishing from CI rather than a laptop buys three things: the tests that gate
# the release are the same ones CI runs, --provenance produces a real attestation
# (it only does so from a trusted CI environment — the same flag run locally is
# accepted and attests nothing), and no long-lived npm token has to live on
# anyone's machine.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (must match package.json)'
        required: true
        type: string

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # mint the OIDC token for provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Required for npm to authenticate at publish time, whether that is via
          # OIDC or a token.
          registry-url: 'https://registry.npmjs.org'

      - run: npm install

      # A version that disagrees with package.json publishes the wrong version
      # under the right name, and npm versions are immutable — so this is
      # settled before anything else runs, whichever way the run was started.
      - name: Resolve and check the version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "requested=$VERSION  package.json=$PKG"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Requested v$VERSION does not match package.json version $PKG."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # npm would reject a duplicate anyway, but it does so after running
      # everything below. Failing here says why in one line.
      - name: Version must not already exist on npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published. npm versions are immutable — bump instead."
            exit 1
          fi
          echo "$NAME@$VERSION is unpublished; continuing."

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: The demo still runs
        run: npm run demo

      - name: The worker still builds for Cloudflare
        run: >-
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/worker-build
          --config server/wrangler.toml

      # Last look at the tarball in the log, so a release always records what
      # actually shipped — and so a stray plaintext file is visible before it
      # reaches the registry rather than after.
      - name: Show what will publish
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Ignored when npm Trusted Publishing is configured for this package —
          # npm exchanges the OIDC token above instead. Set the NPM_TOKEN secret
          # only if you are not using trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Release notes are built into a file rather than passed inline. A
      # multi-line --notes argument must stay indented inside the block scalar;
      # a line starting at column 0 ends the block and makes the whole workflow
      # unparseable, which GitHub reports as a zero-second failure named after
      # the file path, with no error message anywhere in the UI.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"
          {
            echo "Published to npm as \`${NAME}@${VERSION}\`."
            echo
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          } > /tmp/release-notes.md
          # --target is what lets a dispatched run create the tag; on a tag
          # push the tag already exists and gh reuses it.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
